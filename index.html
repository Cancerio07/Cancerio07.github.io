const TH=[['Salam',[...R(0,12),...R(72,75),...R(105,110)]],['Angka',[...R(12,22),...R(75,80),...R(110,115)]],['Makanan',[...R(22,32),...R(80,85),...R(115,120)]],['Keluarga',[...R(32,42),...R(85,90),...R(120,125)]],['Kata kerja',[...R(42,52),...R(90,95),...R(125,130)]],['Belanja',[...R(52,62),...R(95,100),...R(130,135)]],['Tempat',[...R(62,72),...R(100,105),...R(135,140)]]];
const pool=()=>TH[S.th][1];
let P={known:{},wrong:{},cb:{},ok:0};
try{P=Object.assign(P,JSON.parse(localStorage.getItem('nl1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('nl1',JSON.stringify(P))}catch(e){}};
let S={tab:'home',th:0,ci:0,rev:0,fix:0,q:null,qn:0,sp:null,last:-1};
const $=s=>document.querySelector(s);
const sv='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
const spk=(t,l,r)=>`<button class="ic" aria-label="${l}" data-a="say" data-v="${encodeURIComponent(t)}" data-r="${r||.9}">${sv}</button>`;
const btn=(a,t,c,v)=>`<button class="b ${c||''}" data-a="${a}"${v!=null?` data-v="${v}"`:''}>${t}</button>`;
function say(t,r){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='nl-NL';u.rate=r;const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith('nl'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function pick(){const pl=pool(),ws=pl.map(i=>i==S.last?0:1+(P.wrong[i]||0)*2);let r=Math.random()*ws.reduce((a,b)=>a+b,0),k=0;while(r>ws[k]&&k<pl.length-1){r-=ws[k];k++}S.last=pl[k];return pl[k]}
const lev=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]};
const nz=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
const sim=(a,b)=>a==b||(a.length>3&&1-lev(a,b)/Math.max(a.length,b.length)>=.75);
function dots(n){return`<div class="mu" style="font-size:13px;font-weight:700">Salah ${n} dari 3 ${'●'.repeat(n)}${'○'.repeat(3-n)}</div>`}
const fixBox=i=>`<div class="card fix"><div class="lb">KOREKSI</div><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div class="big" style="font-size:28px">${W[i][0]}</div>${spk(W[i][0],'Dengarkan')}</div><p><b>${W[i][2]}</b> (${W[i][1]})</p><p>${W[i][5]}</p><p class="mu">Contoh: ${W[i][3]} = ${W[i][4]}</p><div class="row">${btn('ask','Tanya tutor tentang kata ini','',i)}</div></div>`;
const V={
home(){const pl=pool(),k=pl.filter(i=>P.known[i]).length,tc=TH.map((t,n)=>{const c=t[1].filter(i=>P.known[i]).length;return`<button class="b ${n==S.th?'blu':''}" style="flex:1 1 140px" data-a="th" data-v="${n}">${t[0]} ${c}/${t[1].length}</button>`}).join('');return`<h1>Taal Kita</h1><p class="mu">Belajar Belanda, selangkah demi selangkah. Pilih tema:</p><div class="row" style="margin:0 0 4px">${tc}</div><div class="card hl"><b>${TH[S.th][0]}: ${k} dari ${pl.length} kata dikuasai</b><div class="bar"><i style="width:${k/pl.length*100}%"></i></div><div class="row">${btn('tab','Mulai kartu','acc','cards')}${btn('tab','Latihan','','quiz')}${btn('tab','Uji bicara','','speak')}</div></div><div>${pl.map(i=>`<span class="ch ${P.known[i]?'ok':''}">${W[i][0]}</span>`).join('')}</div>`},
cards(){const i=S.ci,w=W[i];if(S.fix)return`<h1>Koreksi kata</h1><p class="mu">Kata ini belum tahu 3 kali. Pelajari dulu, lalu kita lanjut.</p>${fixBox(i)}${btn('next','Mengerti, lanjut','acc')}`;
return`<h1>Kartu kosakata</h1><p class="mu">${TH[S.th][0]} · kartu ${pool().indexOf(i)+1} / ${pool().length}</p><div class="card hl cen"><div style="display:flex;align-items:center;justify-content:center;gap:12px"><div class="big">${w[0]}</div>${spk(w[0],'Dengarkan kata')}</div><p class="mu">${w[1]}</p>${S.rev?`<div style="font-size:24px;font-weight:800;color:var(--bl)">${w[2]}</div><hr style="border:0;border-top:1px solid var(--ln);margin:14px 0"><div style="display:flex;align-items:center;justify-content:center;gap:10px"><b>${w[3]}</b>${spk(w[3],'Dengarkan kalimat')}</div><p class="mu">${w[4]}</p>`:btn('rev','Lihat arti','blu')}</div>${S.rev?`<div class="row">${btn('no','Belum tahu')}${btn('yes','Sudah tahu','blu')}</div>`:''}`},
quiz(){const q=S.q,w=W[q.i],lis=q.l;return`<h1>Latihan</h1><p class="mu">${lis?'Dengarkan, lalu pilih artinya.':'Pilih arti kata ini.'} Benar: ${P.ok}</p><div class="card hl cen">${lis?spk(w[0],'Putar audio'):`<div style="display:flex;align-items:center;justify-content:center;gap:12px"><div class="big">${w[0]}</div>${spk(w[0],'Dengarkan')}</div>`}</div>${q.t.length&&!q.done?dots(q.t.length):''}<div style="display:flex;flex-direction:column;gap:10px">${q.o.map(o=>{const bad=q.t.includes(o),good=q.done&&o==q.i;return`<button class="b ${good?'ok':bad?'bad':''}" data-a="opt" data-v="${o}" ${bad||q.done?'disabled':''}>${W[o][2]}</button>`}).join('')}</div>${q.t.length&&!q.done?`<div class="msg">${q.t.length==1?`Belum tepat. Petunjuk: arti diawali huruf “${w[2][0]}”.`:'Masih belum. Dengarkan lagi kata ini, lalu coba sekali lagi.'}</div>`:''}${q.done?(q.fix?`<div class="msg">Soal ini akan muncul lagi nanti untuk diulang.</div>${fixBox(q.i)}`:`<div class="msg" style="background:var(--ok);color:var(--oki)"><b>Benar!</b> ${w[5]}</div>`)+btn('nq','Lanjut','acc'):''}`},
speak(){const s=S.sp,w=W[s.i],isW=s.t==w[0],r=s.r,pass=r&&r.score>=.8;return`<h1>Uji berbicara</h1><p class="mu">Dengarkan contoh, lalu ucapkan.</p><div class="card hl cen"><div class="big" style="font-size:${isW?38:28}px">${s.t}</div><p class="mu">${isW?w[1]:w[4]}</p><div class="row" style="justify-content:center">${spk(s.t,'Dengar')}${btn('slow','Pelan')}</div></div><div class="cen"><button class="mic" aria-label="Mulai bicara" data-a="mic"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><p class="mu">${s.on?'Mendengarkan…':'Tekan dan ucapkan'}</p></div>${s.msg?`<div class="msg">${s.msg}</div>`:''}${r?`<div class="card"><b>Hasil: ${Math.round(r.score*100)}%</b><div>${r.w.map(x=>`<span class="ch ${x[1]?'ok':'wn'}">${x[0]}</span>`).join('')}</div></div>`:''}${r&&!pass&&s.tr<3?dots(s.tr)+`<p>Coba lagi, ucapkan lebih jelas.</p>`:''}${r&&!pass&&s.tr>=3?`<div class="msg">Kata ini akan lebih sering muncul di latihan.</div>`+fixBox(s.i)+`<p class="mu">Bagian yang meleset: ${r.w.filter(x=>!x[1]).map(x=>x[0]).join(', ')}</p><div class="row">${btn('skip','Lewati dulu')}${btn('again','Coba lagi','acc')}</div>`:''}${pass?`<div class="msg" style="background:var(--ok);color:var(--oki)"><b>Bagus!</b> Ucapan Anda terdengar jelas.</div>${btn('skip','Lanjut','acc')}`:''}`}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const CH=['Kapan memakai de dan kapan het?','Kenapa huruf g dibaca serak?','Apa beda jij dan je?','Bagaimana menyusun kalimat dasar?'];
const msgsH=()=>(S.tt||[]).map(m=>`<div class="card" style="${m.r=='u'?'background:var(--tr);':''}white-space:pre-wrap"><div class="lb">${m.r=='u'?'ANDA':'TUTOR'}</div>${esc(m.t)||'<span class="mu">Tutor sedang berpikir…</span>'}</div>`).join('');
function updT(){const m=$('#msgs');if(m){m.innerHTML=msgsH();window.scrollTo(0,document.body.scrollHeight)}}
document.addEventListener('input',e=>{if(e.target.id=='tin')S.tin=e.target.value});
V.tanya=()=>`<h1>Tanya tutor</h1><p class="mu">Tanyakan apa saja tentang bahasa Belanda. Jawaban dibuat oleh Claude, jadi cek ulang untuk hal yang penting.</p><div id="msgs">${msgsH()}</div>${S.te?`<div class="msg">${S.te}</div>`:''}${!(S.tt||[]).length?`<div class="row">${CH.map(c=>`<button class="b" style="flex:1 1 100%;text-align:left" data-a="chip" data-v="${encodeURIComponent(c)}">${c}</button>`).join('')}</div>`:''}<textarea id="tin" rows="3" placeholder="Tulis pertanyaan Anda…" style="width:100%;box-sizing:border-box;margin-top:12px;padding:12px;border-radius:14px;border:2px solid var(--ln);background:var(--sf);color:var(--ink);font:400 16px 'Nunito',sans-serif">${esc(S.tin||'')}</textarea><div class="row"><button class="b acc" data-a="send" ${S.tl?'disabled':''}>${S.tl?'Menjawab…':'Kirim'}</button>${(S.tt||[]).length?btn('clear','Mulai baru'):''}</div>`;
async function send(){const q=(S.tin||'').trim();if(!q||S.tl)return;S.tt=S.tt||[];S.te='';
const ctx=Object.keys(P.wrong).filter(i=>P.wrong[i]>0&&W[i]).sort((a,b)=>P.wrong[b]-P.wrong[a]).slice(0,5).map(i=>W[i][0]).join(', ');
const hist=S.tt.slice(-6).map(m=>(m.r=='u'?'Murid: ':'Tutor: ')+m.t).join('\n');
const a={r:'a',t:''};S.tt.push({r:'u',t:q},a);S.tin='';S.tl=1;render();updT();
try{const sample=await claude.use('sample');if(!sample)throw{code:'na'};
const r=await sample('Kamu adalah tutor bahasa Belanda yang ramah untuk pemula total penutur bahasa Indonesia (level A1). Jawab dalam bahasa Indonesia, singkat (maksimal sekitar 120 kata), jelas, dengan contoh kalimat Belanda beserta artinya. Tulis cara baca dengan ejaan yang mudah bagi penutur Indonesia. Jangan memakai format markdown seperti tanda bintang atau pagar. Hanya bahas pembelajaran bahasa Belanda; jika di luar topik, arahkan kembali dengan sopan. Jika tidak yakin, katakan terus terang.'+(ctx?'\nKata yang sering dijawab salah oleh murid: '+ctx+'.':'')+(hist?'\nRiwayat percakapan:\n'+hist:'')+'\nPertanyaan murid: '+q,{cache:false,onText:x=>{a.t=x.text;updT()}});a.t=r.text}
catch(e){S.tt.splice(-2);S.tin=q;S.te=e&&e.code=='na'?'Tutor AI hanya tersedia saat halaman dibuka lewat claude.ai di browser.':e&&e.code=='not_granted'?'Izin untuk tutor AI belum diberikan. Kirim pertanyaan lagi dan setujui permintaannya.':e&&e.code=='rate_limited'?'Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.':'Tutor sedang tidak bisa menjawab. Coba lagi sebentar.'}
S.tl=0;render();updT()}
function newQ(){const i=pick(),o=sh([i,...sh(pool().filter(j=>j!=i)).slice(0,3)]);S.q={i,o,t:[],done:0,fix:0,l:S.qn++%2==1}}
function newSp(){const i=pick();S.sp={i,t:Math.random()<.5?W[i][0]:W[i][3],tr:0,r:null,msg:'',on:0}}
function check(alts){const s=S.sp,tg=nz(s.t),hs=alts.flatMap(nz);let w=tg.map(t=>[t,hs.some(h=>sim(t,h))]);let sc=w.filter(x=>x[1]).length/w.length;const j=tg.join(''),hj=alts.map(a=>nz(a).join(''));if(sc<.8&&hj.some(h=>sim(j,h))){w=w.map(x=>[x[0],1]);sc=1}
s.r={w,score:sc};s.on=0;s.msg='';if(sc<.8){s.tr++;P.wrong[s.i]=(P.wrong[s.i]||0)+1;save()}render()}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition,s=S.sp;if(!R){s.msg='Perangkat ini belum mendukung pengenalan suara. Coba Chrome atau Safari.';render();return}
const r=new R();r.lang='nl-NL';r.maxAlternatives=3;r.onresult=e=>check([...e.results[0]].map(a=>a.transcript));r.onerror=e=>{s.on=0;s.msg=e.error=='not-allowed'?'Izinkan akses mikrofon di pengaturan browser, lalu coba lagi.':'Suara tidak terdengar. Coba lagi.';render()};r.onend=()=>{if(s.on){s.on=0;s.msg='Suara tidak terdengar. Coba lagi.';render()}};s.on=1;s.msg='';s.r=s.r&&s.r.score>=.8?null:s.r;render();try{r.start()}catch(e){s.on=0}}
const nextCard=()=>{S.fix=0;S.rev=0;const pl=pool(),p=Math.max(0,pl.indexOf(S.ci));for(let k=1;k<=pl.length;k++){const j=pl[(p+k)%pl.length];if(!P.known[j]){S.ci=j;return}}S.ci=pl[(p+1)%pl.length]};
const A={
tab(v){S.tab=v;if(v=='quiz'&&!S.q)newQ();if(v=='speak'&&!S.sp)newSp()},
th(v){S.th=+v;S.ci=TH[S.th][1][0];S.rev=0;S.fix=0;S.q=null;S.sp=null;S.last=-1},
say(v,b){say(decodeURIComponent(v),+b.dataset.r)},slow(){say(S.sp.t,.55)},
rev(){S.rev=1},yes(){P.known[S.ci]=1;P.cb[S.ci]=0;save();nextCard()},
no(){P.cb[S.ci]=(P.cb[S.ci]||0)+1;P.wrong[S.ci]=(P.wrong[S.ci]||0)+1;if(P.cb[S.ci]>=3){P.cb[S.ci]=0;S.fix=1}else nextCard();save()},next(){nextCard()},
opt(v){const q=S.q,o=+v;if(q.done)return;if(o==q.i){q.done=1;P.ok++}else{q.t.push(o);P.wrong[q.i]=(P.wrong[q.i]||0)+1;if(q.t.length>=3){q.done=1;q.fix=1}else if(q.t.length==2)say(W[q.i][0],.8)}save()},
nq(){newQ()},ask(v){S.tab='tanya';S.tin='Tolong jelaskan kata “'+W[+v][0]+'” dengan lebih sederhana dan beri dua contoh lain.'},chip(v){S.tin=decodeURIComponent(v);send()},send(){send()},clear(){S.tt=[];S.te=''},mic(){mic()},skip(){newSp()},again(){S.sp.tr=0;S.sp.r=null;S.sp.msg=''}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f){f(b.dataset.v,b);if(b.dataset.a!='say'&&b.dataset.a!='slow'&&b.dataset.a!='mic')render()}});
function render(){const T=[['home','Beranda'],['cards','Kartu'],['quiz','Latihan'],['speak','Bicara'],['tanya','Tanya']];$('#app').innerHTML=`<div class="fl"><i style="background:#C2410C"></i><i style="background:#fff"></i><i style="background:#21468B"></i></div><main>${V[S.tab]()}</main><nav>${T.map(t=>`<button class="${S.tab==t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</nav>`;if(S.tab!='tanya')window.scrollTo(0,0)}
try{speechSynthesis.getVoices()}catch(e){}
render();
</script></body></html>
